name: Aktualizacja S&P 500 TR
on:
  schedule:
    - cron: "30 23 * * 1-5"   # po zamknięciu sesji w USA, dni robocze
  workflow_dispatch:           # ręczne uruchomienie z zakładki Actions
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance
      - run: python scripts/fetch_sp500tr.py
      - name: Commit, jeśli są zmiany
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sp500tr.csv
          git diff --cached --quiet || (git commit -m "Aktualizacja S&P 500 TR" && git push)
